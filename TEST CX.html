<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Wirtualna Asystentka eBOK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <style>
    df-messenger {
      z-index: 999;
      position: absolute;
      bottom: 16px;
      right: 16px;
      --df-messenger-titlebar-title-font-size: 16px;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-chat-window-height: 75vh;
      --df-messenger-chat-window-width: 35vw;
      --df-messenger-message-user-background: #d81e04;
      --df-messenger-message-user-font-color: #FFF;
      --df-messenger-message-bot-background: #ffffff;
      --df-messenger-message-bot-font-color: #000000;
      --df-messenger-send-icon-color: #d81e04;
      --df-messenger-card-background: transparent;
      --df-messenger-card-border: none;
      --df-messenger-card-padding: 0;
      --df-messenger-card-box-shadow: none;
      --df-messenger-message-bot-border: 2px solid #d81e04;
    }
    df-messenger-chat-bubble {
      --df-messenger-chat-bubble-background: #ffffff;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.25));
    }
  </style>
</head>
<body>
  <df-messenger
    project-id="wirtualna-asystentka-cx"
    agent-id="971672d5-f388-4c83-bc51-97e8945c8ad6"
    language-code="pl"
    chat-title="Wirtualna Asystentka eBOK"
    max-query-length="-1"
    chat-icon='https://raw.githubusercontent.com/W0jt3kk/CX_test/refs/heads/main/favicon.png'
    url-allowlist="https://ebok.pgnig.pl, https://www.google.com, https://*.googleusercontent.com, https://*.gstatic.com, https://storage.googleapis.com, data:">
  </df-messenger>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const SESSION_KEY = 'df-welcome-message-shown';
      if (sessionStorage.getItem(SESSION_KEY)) return;
      const df = document.querySelector('df-messenger');

      const trySetPlaceholder = chatBubble => {
        const chat = chatBubble.shadowRoot?.querySelector('df-messenger-chat');
        const userInputContainer = chat?.shadowRoot?.querySelector('df-messenger-user-input');
        const inputBox = userInputContainer?.shadowRoot?.querySelector('.input-box-wrapper .input-content-wrapper .input-box');
        if (inputBox) {
          inputBox.setAttribute('placeholder', 'Tutaj wpisz swoje pytanie');
          return true;
        }
        return false;
      };

      const readyChecker = setInterval(() => {
        if (df && df.renderCustomText && df.renderCustomCard) {
          clearInterval(readyChecker);
          sessionStorage.setItem(SESSION_KEY, '1');

          df.renderCustomCard([{type: 'image', rawUrl: 'https://raw.githubusercontent.com/W0jt3kk/CX_test/refs/heads/main/obrazek-widget.png', accessibilityText: 'PGNiG – grafika powitalna'}]);
          
          df.renderCustomText(
            'Dzień dobry! Jestem Wirtualną Asystentką eBOK.\n\nPamiętaj, że nie jestem człowiekiem, a część treści jest generowana przez AI - zweryfikuj ważne informacje.',
            true
          );

          const buttonPayload = [{
            type: 'button',
            text: 'Rozumiem, zaczynajmy!',
            mode: 'blocking',
            event: {
              event: 'welcome_accepted'
            },
            icon: {
              type: 'rocket_launch',
              color: '#ffffff'
            }
          }];

          df.renderCustomCard(buttonPayload);

          const chatBubble = document.createElement('df-messenger-chat-bubble');
          chatBubble.setAttribute('chat-icon', 'https://raw.githubusercontent.com/W0jt3kk/CX_test/refs/heads/main/favicon.png');
          chatBubble.setAttribute('chat-title', 'Wirtualna Asystentka eBOK');
          df.appendChild(chatBubble);

          // Stylowanie wyłącznie przycisku powitalnego
          // Stylowanie wyłącznie przycisku powitalnego
          const styleWelcomeButton = (root) => {
            const stack = [root];

            while (stack.length) {
              const node = stack.pop();

              if (node.shadowRoot) {
                stack.push(node.shadowRoot);
              }

              if (
                node.matches?.('button, [role="button"], a, .button') &&
                node.textContent?.includes('Rozumiem, zaczynajmy!')
              ) {
                node.setAttribute('data-ebok-welcome-button', '');

                const styleRoot = node.getRootNode();
                const customStyle = document.createElement('style');

                customStyle.textContent = `
                  [data-ebok-welcome-button] {
                    background-color: #d81e04 !important;
                    color: #ffffff !important;
                    border: 2px solid #d81e04 !important;
                    box-sizing: border-box !important;
                    box-shadow: none !important;
                    opacity: 1 !important;
                    filter: none !important;
                    transition: background-color 300ms ease,
                                color 300ms ease !important;

                    /* Wyrównanie do prawej */
                    margin-left: auto !important;
                    margin-right: 0 !important;
                    justify-self: end !important;
                    float: right !important;
                  }

                  [data-ebok-welcome-button]:hover {
                    background-color: #ffffff !important;
                    color: #000000 !important;
                    opacity: 1 !important;
                    filter: none !important;
                  }

                  /* Wyłączenie domyślnych nakładek */
                  [data-ebok-welcome-button]::before,
                  [data-ebok-welcome-button]::after {
                    content: none !important;
                  }

                  /* Biały tekst w stanie normalnym */
                  [data-ebok-welcome-button] *,
                  [data-ebok-welcome-button] *::before,
                  [data-ebok-welcome-button] *::after {
                    color: #ffffff !important;
                    opacity: 1 !important;
                    filter: none !important;
                    transition: color 300ms ease,
                                fill 300ms ease !important;
                  }

                  /* Czarny tekst podczas hovera */
                  [data-ebok-welcome-button]:hover *,
                  [data-ebok-welcome-button]:hover *::before,
                  [data-ebok-welcome-button]:hover *::after {
                    color: #000000 !important;
                    opacity: 1 !important;
                    filter: none !important;
                  }

                  /* Rakieta: biała normalnie */
                  [data-ebok-welcome-button] svg,
                  [data-ebok-welcome-button] svg * {
                    fill: #ffffff !important;
                    color: #ffffff !important;
                  }

                  /* Rakieta: czerwona na hoverze */
                  [data-ebok-welcome-button]:hover svg,
                  [data-ebok-welcome-button]:hover svg * {
                    fill: #d81e04 !important;
                    color: #d81e04 !important;
                  }
                `;

                styleRoot.appendChild(customStyle);

                return true;
              }

              for (const child of node.childNodes || []) {
                stack.push(child);
              }
            }

            return false;
          };

          let styleAttempts = 0;
          const buttonStylePoll = setInterval(() => {
            styleAttempts++;

            if (styleWelcomeButton(df) || styleAttempts >= 40) {
              clearInterval(buttonStylePoll);
            }
          }, 150);

          let welcomeAccepted = false;

          const updateInput = () => {
            const chat = chatBubble.shadowRoot?.querySelector('df-messenger-chat');
            const userInput = chat?.shadowRoot?.querySelector('df-messenger-user-input');

            if (!userInput) return false;

            // Input pozostaje widoczny, ale jest nieaktywny do akceptacji
            userInput.style.display = '';
            userInput.style.pointerEvents = welcomeAccepted ? '' : 'none';
            userInput.style.opacity = welcomeAccepted ? '1' : '0.65';

            // Delikatne ukośne kreskowanie nieaktywnego inputu
            userInput.style.setProperty(
              '--df-messenger-input-background',
              welcomeAccepted
                ? '#ffffff'
                : 'repeating-linear-gradient(135deg, #f4f4f4 0px, #f4f4f4 3px, #dedede 3px, #dedede 4px)'
            );

            trySetPlaceholder(chatBubble);

            // Placeholder zależny od etapu rozmowy
            const inputBox = userInput.shadowRoot?.querySelector(
              '.input-box-wrapper .input-content-wrapper .input-box'
            );

            if (inputBox) {
              inputBox.setAttribute(
                'placeholder',
                welcomeAccepted
                  ? 'Tutaj wpisz swoje pytanie'
                  : 'Aby zacząć, wybierz powyższy guzik.'
              );
            }

            return true;
          };

          const waitForInput = () => {
            let attempts = 0;
            const pollId = setInterval(() => {
              attempts++;
              if (updateInput() || attempts >= 40) {
                clearInterval(pollId);
              }
            }, 150);
          };

          waitForInput();

          chatBubble.addEventListener('click', waitForInput);

          window.addEventListener('df-button-clicked', (event) => {
            if (event.detail?.text !== 'Rozumiem, zaczynajmy!') return;

            welcomeAccepted = true;
            updateInput();
          });
        }
      }, 100);
    });
  </script>
</body>
</html>
