<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Wirtualna Asystentka PGNiG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Dialogflow Messenger -->
  <link rel="stylesheet"
        href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <!-- Styl widgetu -->
  <style>
    df-messenger {
      z-index: 999;
      position: absolute;
      bottom: 16px;
      right: 16px;

      --df-messenger-titlebar-title-font-size: 16px;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-chat-window-height: 75vh;
      --df-messenger-chat-window-width: 50vh;
      --df-messenger-message-user-background: #ff6309;
      --df-messenger-message-user-font-color: #FFF;
      --df-messenger-message-bot-background: #1B4280;
      --df-messenger-message-bot-font-color: #FFF;
      --df-messenger-send-icon-color: #ff6309;
    }
  </style>
</head>
<body>

  <!-- Komponent DF Messenger -->
  <df-messenger
    project-id="wirtualna-asystentka-cx"
    agent-id="971672d5-f388-4c83-bc51-97e8945c8ad6"
    language-code="pl"
    chat-title="Wirtualna Asystentka PGNiG"
    max-query-length="-1"
    chat-icon="https://ebok.pgnig.pl/assets/ico/favicon-36x36.png">
  </df-messenger>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const SESSION_KEY = 'df-welcome-message-shown';
      if (sessionStorage.getItem(SESSION_KEY)) return;

      const df = document.querySelector('df-messenger');

      /* ---------- 1. Funkcja zmieniająca placeholder ---------- */
      const changePlaceholder = () => {
        const chat      = df.shadowRoot?.querySelector('df-messenger-chat');
        const userInput = chat?.shadowRoot?.querySelector('df-messenger-user-input');
        const inputBox  = userInput?.shadowRoot?.querySelector(
          '.input-box-wrapper .input-content-wrapper .input-box'
        );

        if (inputBox) {
          inputBox.setAttribute('placeholder', 'Zadaj pytanie'); // <- zmień tekst, jeśli chcesz
          return true;
        }
        return false;
      };

      /* ---------- 2. Czekamy aż widget będzie gotowy ---------- */
      const pollUntilReady = () => {
        if (!changePlaceholder()) {
          const id = setInterval(() => {
            if (changePlaceholder()) clearInterval(id);
          }, 200);
        }
      };

      /* ---------- 3. Logika powitalna ---------- */
      const readyChecker = setInterval(() => {
        if (df && df.renderCustomText && df.renderCustomCard) {
          clearInterval(readyChecker);
          sessionStorage.setItem(SESSION_KEY, '1');

          df.renderCustomText(
            'Dzień dobry! Jestem Wirtualną Asystentką PGNiG. W czym mogę Ci pomóc?\n\nPamiętaj, że nie jestem człowiekiem. Zapytaj hasłowo – będzie mi Cię łatwiej zrozumieć.',
            true
          );

          setTimeout(() => {
            const chipsPayload = [{
              type: 'chips',
              options: [
                { text: 'Najczęstsze pytania' },
                { text: 'Regulamin usługi / Polityka prywatności' }
              ]
            }];
            df.renderCustomCard(chipsPayload);
          }, 1500);

          /* ---------- 4. Tworzymy bąbelek czatu ---------- */
          const chatBubble = document.createElement('df-messenger-chat-bubble');
          chatBubble.setAttribute('chat-icon', 'https://ebok.pgnig.pl/assets/ico/favicon-36x36.png');
          chatBubble.setAttribute('chat-title', 'Wirtualna Asystentka PGNiG');
          df.appendChild(chatBubble);

          /* 5. Zmieniamy placeholder, gdy użytkownik otworzy czat */
          chatBubble.addEventListener('click', pollUntilReady);

          /* 6. Na wszelki wypadek – jedna próba od razu po załadowaniu */
          pollUntilReady();
        }
      }, 100);
    });
  </script>

</body>
</html>
