<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Wirtualna Asystentka PGNiG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <style>
    df-messenger {
      z-index: 999;
      position: absolute;
      bottom: 16px;
      right: 16px;
      --df-messenger-titlebar-title-font-size: 16px;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-chat-window-height: 75vh;
      --df-messenger-chat-window-width: 50vh;
      --df-messenger-message-user-background: #ff6309;
      --df-messenger-message-user-font-color: #FFF;
      --df-messenger-message-bot-background: #1B4280;
      --df-messenger-message-bot-font-color: #FFF;
      --df-messenger-send-icon-color: #ff6309;

      --df-messenger-card-background: transparent;
      --df-messenger-card-border: none;
      --df-messenger-card-padding: 0;
      --df-messenger-card-box-shadow: none;
    }
    df-messenger-chat-bubble {
      --df-messenger-chat-bubble-background: #ffffff;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.25));
    }
  </style>
</head>
<body>
  <df-messenger
    project-id="wirtualna-asystentka-cx"
    agent-id="971672d5-f388-4c83-bc51-97e8945c8ad6"
    language-code="pl"
    chat-title="Wirtualna Asystentka PGNiG"
    max-query-length="-1"
    chat-icon="https://ebok.pgnig.pl/assets/ico/favicon-36x36.png"
    url-allowlist="https://ebok.pgnig.pl, https://www.google.com, https://*.googleusercontent.com, https://*.gstatic.com, https://storage.googleapis.com, data:">
  </df-messenger>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const SESSION_KEY = 'df-welcome-message-shown';
      if (sessionStorage.getItem(SESSION_KEY)) return;

      const df = document.querySelector('df-messenger');

      const HERO_SRC = 'https://raw.githubusercontent.com/W0jt3kk/CX_test/refs/heads/main/maly-bot.png';
      const HERO_WIDTH = 160;          // px
      const OFFSET_X_PCT = -5;         // procent szerokości pierwszego dymka (ujemne = w lewo)
      const OVERLAP_Y_PCT = 18;        // procent wysokości obrazka, o jaki ma "siąść" na dymek (w dół)

      function createOrGetHero() {
        let hero = document.getElementById('df-hero-overlay');
        if (!hero) {
          hero = document.createElement('img');
          hero.id = 'df-hero-overlay';
          hero.src = HERO_SRC;
          hero.alt = '';
          hero.style.position = 'fixed';
          hero.style.width = HERO_WIDTH + 'px';
          hero.style.pointerEvents = 'none';
          hero.style.zIndex = '2147483647';
          hero.style.display = 'none';
          document.body.appendChild(hero);
        }
        return hero;
      }

      function placeHero() {
        const chat = df?.shadowRoot?.querySelector('df-messenger-chat');
        const sr = chat?.shadowRoot;
        const msgList = sr?.querySelector('[part="messagelist"]') || sr?.querySelector('.message-list') || sr;
        const firstBotMsg = msgList?.querySelector('[data-actor="agent"], [data-message-type="bot"], .message--bot, .message');

        const hero = createOrGetHero();

        if (!chat || !firstBotMsg) {
          hero.style.display = 'none';
          return;
        }

        if (!hero.complete) {
          hero.addEventListener('load', placeHero, { once: true });
          return;
        }

        const rect = firstBotMsg.getBoundingClientRect();
        if (!rect || rect.width === 0 || rect.height === 0) {
          hero.style.display = 'none';
          return;
        }

        const naturalW = hero.naturalWidth || HERO_WIDTH;
        const naturalH = hero.naturalHeight || HERO_WIDTH;
        const heroHeight = Math.max(1, Math.round(HERO_WIDTH * naturalH / naturalW));

        const offsetX = (OFFSET_X_PCT / 100) * rect.width;
        const overlapY = (OVERLAP_Y_PCT / 100) * heroHeight;

        const left = Math.round(rect.left + offsetX);
        const top  = Math.round(rect.top - heroHeight + overlapY);

        hero.style.left = left + 'px';
        hero.style.top  = top + 'px';
        hero.style.display = 'block';
      }

      function wireHeroReposition() {
        const chat = df?.shadowRoot?.querySelector('df-messenger-chat');
        const sr = chat?.shadowRoot;
        const msgList = sr?.querySelector('[part="messagelist"]') || sr?.querySelector('.message-list');

        placeHero();
        window.addEventListener('resize', placeHero);
        msgList?.addEventListener('scroll', placeHero, { passive: true });
      }

      const trySetPlaceholder = chatBubble => {
        const chat = chatBubble.shadowRoot?.querySelector('df-messenger-chat');
        const userInputContainer = chat?.shadowRoot?.querySelector('df-messenger-user-input');
        const inputBox = userInputContainer?.shadowRoot?.querySelector('.input-box-wrapper .input-content-wrapper .input-box');
        if (inputBox) {
          inputBox.setAttribute('placeholder', 'Tutaj wpisz swoje pytanie');
          return true;
        }
        return false;
      };

      const readyChecker = setInterval(() => {
        if (df && df.renderCustomText && df.renderCustomCard) {
          clearInterval(readyChecker);
          sessionStorage.setItem(SESSION_KEY, '1');

          df.renderCustomCard([
            { type: 'image', rawUrl: 'https://raw.githubusercontent.com/W0jt3kk/CX_test/refs/heads/main/maly-bot.png', accessibilityText: 'PGNiG – grafika powitalna' }
          ]);

          df.renderCustomText('Dzień dobry! Jestem Wirtualną Asystentką PGNiG. W czym mogę Ci pomóc?\n\nPamiętaj, że nie jestem człowiekiem. Zapytaj hasłowo – będzie mi Cię łatwiej zrozumieć.', true);

          setTimeout(() => {
            const chipsPayload = [{
              type: 'chips',
              options: [
                { text: 'Najczęstsze pytania' },
                { text: 'Regulamin usługi / Polityka prywatności' }
              ]
            }];
            df.renderCustomCard(chipsPayload);
          }, 1500);

          const chatBubble = document.createElement('df-messenger-chat-bubble');
          chatBubble.setAttribute('chat-icon', 'https://ebok.pgnig.pl/assets/ico/favicon-36x36.png');
          chatBubble.setAttribute('chat-title', 'Wirtualna Asystentka PGNiG');
          df.appendChild(chatBubble);

          trySetPlaceholder(chatBubble);

          chatBubble.addEventListener('click', () => {
            const pollId = setInterval(() => {
              if (trySetPlaceholder(chatBubble)) clearInterval(pollId);
            }, 150);
            setTimeout(wireHeroReposition, 400);
          });

          setTimeout(wireHeroReposition, 500);
        }
      }, 100);
    });
  </script>
</body>
</html>
