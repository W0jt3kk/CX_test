<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wirtualna Asystentka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  
  <style>
    df-messenger {
      --df-messenger-button-titlebar-color: #1B4280;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-font-color: #000;
      --df-messenger-send-icon: #ff6309;
      --df-messenger-user-message: #ff6309;
    }
  </style>
</head>

<body>
  <df-messenger
    project-id="wirtualna-asystentka-cx"
    agent-id="971672d5-f388-4c83-bc51-97e8945c8ad6"
    language-code="pl"
    chat-title="Wirtualna Asystentka PGNiG">
  </df-messenger>

<script>
document.addEventListener('df-messenger-loaded', () => {
  const dfMessenger = document.querySelector('df-messenger');
  
  // Resetowanie sesji dla celów testowych
  dfMessenger.startNewSession({ retainHistory: false });

  // Wiadomość powitalna
  dfMessenger.renderCustomText('Cześć! W czym mogę pomóc?', true);

  // Przyciski w formacie Dialogflow CX
  const payload = {
    "richContent": [
      [
        {
          "type": "chips",
          "options": [
            { "text": "FAQ" },
            { "text": "Regulamin usługi / Polityka prywatności" }
          ]
        }
      ]
    ]
  };

  setTimeout(() => {
    dfMessenger.renderCustomCard(payload.richContent);
  }, 1000);
});

document.addEventListener('df-chip-clicked', (event) => {
  const dfMessenger = document.querySelector('df-messenger');
  dfMessenger.sendQuery(event.detail.text);
});
</script>

</body>
</html>
