<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wirtualna Asystentka PGNiG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <style>
    df-messenger {
      z-index: 999;
      position: absolute;
      bottom: 16px;
      right: 16px;

      --df-messenger-titlebar-title-font-size: 16px;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-chat-window-height: 75vh;
      --df-messenger-chat-window-width: 50vh;
      --df-messenger-message-user-background: #ff6309;
      --df-messenger-message-user-font-color: #FFF;
      --df-messenger-message-bot-background: #1B4280;
      --df-messenger-message-bot-font-color: #FFF;
      --df-messenger-send-icon-color: #ff6309;
    }
  </style>
</head>
<body>

  <df-messenger
    project-id="wirtualna-asystentka-cx"
    agent-id="971672d5-f388-4c83-bc51-97e8945c8ad6"
    language-code="pl"
    chat-title="Wirtualna Asystentka PGNiG"
    max-query-length="-1">
  </df-messenger>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const SESSION_KEY = 'df-welcome-message-shown';
    const df = document.querySelector('df-messenger');

    // Zmiana placeholdera (działa zawsze, niezależnie od sesji)
    const setCustomPlaceholder = () => {
      const chat = df?.shadowRoot?.querySelector('df-messenger-chat');
      const inputWrapper = chat?.shadowRoot?.querySelector('df-messenger-user-input');
      const inputField = inputWrapper?.shadowRoot?.querySelector('.input-box-wrapper > input');

      if (inputField) {
        inputField.placeholder = 'Czekam na Twoje pytanie';
      } else {
        requestAnimationFrame(setCustomPlaceholder);
      }
    };

    // Uruchom sprawdzanie placeholdera niezależnie od sesji
    requestAnimationFrame(setCustomPlaceholder);

    // Jeśli już było powitanie, nic nie robimy
    if (sessionStorage.getItem(SESSION_KEY)) return;

    const readyChecker = setInterval(() => {
      if (df && df.renderCustomText && df.renderCustomCard) {
        clearInterval(readyChecker);
        sessionStorage.setItem(SESSION_KEY, '1');

        // Powitanie
        df.renderCustomText(
          'Dzień dobry! Jestem Wirtualną Asystentką eBOK PGNiG. W czym mogę Ci pomóc?\n\nPamiętaj, że nie jestem człowiekiem. Zapytaj hasłowo - będzie mi Cię łatwiej zrozumieć.',
          true
        );

        // Chipsy
        setTimeout(() => {
          const chipsPayload = [
            {
              type: 'chips',
              options: [
                { text: 'Najczęstsze pytania' },
                { text: 'Regulamin usługi / Polityka prywatności' }
              ]
            }
          ];
          df.renderCustomCard(chipsPayload);
        }, 1500);
      }
    }, 100);
  });
</script>

</body>
</html>
