<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Wirtualna Asystentka eBOK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    df-messenger {
      z-index: 999;
      display: block;
      position: relative;
      width: 80vw;
      height: 92vh;
      --df-messenger-titlebar-title-font-size: 16px;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-message-user-background: #d81e04;
      --df-messenger-message-user-font-color: #FFF;
      --df-messenger-message-bot-background: #ffffff;
      --df-messenger-message-bot-font-color: #000000;
      --df-messenger-send-icon-color: #d81e04;
      --df-messenger-card-background: transparent;
      --df-messenger-card-border: none;
      --df-messenger-card-padding: 0;
      --df-messenger-card-box-shadow: none;
      --df-messenger-message-bot-border: 2px solid #d81e04;
      --df-messenger-message-bot-margin-left: 0px;
      --df-messenger-message-bot-margin-right: 50%;
      --df-messenger-message-user-margin-left: 50%;
      --df-messenger-message-user-margin-right: 0px;
    }
    @media (max-width: 700px) {
      df-messenger {
        width: 100vw;
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <df-messenger
    project-id="wirtualna-asystentka-cx"
    agent-id="971672d5-f388-4c83-bc51-97e8945c8ad6"
    language-code="pl"
    max-query-length="-1"
    url-allowlist="https://ebok.myorlen.pl, https://ebok.pgnig.pl, https://www.google.com, https://*.googleusercontent.com, https://*.gstatic.com, https://storage.googleapis.com, data:">
    <df-messenger-chat chat-title="Wirtualna Asystentka eBOK"></df-messenger-chat>
  </df-messenger>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const SESSION_KEY = 'df-welcome-message-shown-kontakt';
      if (sessionStorage.getItem(SESSION_KEY)) return;
      const df = document.querySelector('df-messenger');

      const trySetPlaceholder = chatElement => {
        const chat = chatElement;
        const userInputContainer = chat?.shadowRoot?.querySelector('df-messenger-user-input');
        const inputBox = userInputContainer?.shadowRoot?.querySelector('.input-box-wrapper .input-content-wrapper .input-box');
        if (inputBox) {
          inputBox.setAttribute('placeholder', 'Tutaj wpisz swoje pytanie');
          return true;
        }
        return false;
      };

      const readyChecker = setInterval(() => {
        if (df && df.renderCustomText && df.renderCustomCard) {
          clearInterval(readyChecker);
          sessionStorage.setItem(SESSION_KEY, '1');

          df.renderCustomCard([{type: 'image', rawUrl: 'https://raw.githubusercontent.com/W0jt3kk/CX_test/refs/heads/main/obrazek-widget.png', accessibilityText: 'PGNiG – grafika powitalna'}]);
          
          df.renderCustomText(
            'Dzień dobry! Jestem Wirtualną Asystentką eBOK.\n\nPamiętaj, że nie jestem człowiekiem, a część treści jest generowana przez AI - zweryfikuj ważne informacje.',
            true
          );

          const buttonPayload = [{
            type: 'button',
            text: 'Rozumiem, zaczynajmy!',
            mode: 'blocking',
            event: {
              event: 'welcome_accepted'
            },
            icon: {
              type: 'rocket_launch',
              color: '#ffffff'
            }
          }];

          df.renderCustomCard(buttonPayload);

          const chatElement = df.querySelector('df-messenger-chat');

          // Poprawa szerokości i wyglądu accordionów
          const restoreAccordionAppearance = () => {
            const stack = [df];

            while (stack.length) {
              const node = stack.pop();

              if (!node) continue;

              if (
                node.tagName === 'DF-CARD' &&
                node.shadowRoot?.querySelector('df-accordion')
              ) {
                // Accordion zajmuje maksymalnie lewą połowę rozmowy
                node.style.setProperty('width', '100%', 'important');
                node.style.setProperty('max-width', '50%', 'important');
                node.style.setProperty('box-sizing', 'border-box', 'important');
                node.style.setProperty('align-self', 'flex-start', 'important');

                // Przywrócenie wyglądu accordiona
                node.style.setProperty(
                  '--df-messenger-card-background',
                  '#ffffff',
                  'important'
                );

                node.style.setProperty(
                  '--df-messenger-card-padding',
                  '16px',
                  'important'
                );
              }

              // Chipsy - maksymalnie lewa połowa rozmowy
              if (node.tagName === 'DF-CHIPS') {
                node.style.setProperty('width', '50%', 'important');
                node.style.setProperty('max-width', '50%', 'important');
                node.style.setProperty('min-width', '0', 'important');
                node.style.setProperty('box-sizing', 'border-box', 'important');
                node.style.setProperty('align-self', 'flex-start', 'important');
              }

              if (node.shadowRoot) {
                stack.push(...node.shadowRoot.children);
              }

              stack.push(...node.children);            }
          };

          // Poprawianie accordionów po otrzymaniu odpowiedzi z CX
          window.addEventListener('df-response-received', () => {
            requestAnimationFrame(restoreAccordionAppearance);
            setTimeout(restoreAccordionAppearance, 100);
            setTimeout(restoreAccordionAppearance, 500);
          });

          // Obsługa accordionów już obecnych w rozmowie
          restoreAccordionAppearance();

          // Wyśrodkowanie wyłącznie grafiki powitalnej
          const centerWelcomeImage = (root) => {
            const stack = [root];

            while (stack.length) {
              const node = stack.pop();

              if (node.shadowRoot) {
                stack.push(node.shadowRoot);
              }

              if (
                node.tagName === 'IMG' &&
                node.getAttribute('src')?.includes('obrazek-widget.png')
              ) {
                let card = node;

                while (card && card.tagName !== 'DF-CARD') {
                  card = card.parentElement || card.getRootNode().host || null;
                }

                if (!card) return false;

                const messageStack = card.parentElement;
                const utterance = messageStack.getRootNode().host;
                const entry = utterance.parentElement;
                const content = entry.parentElement;

                if (!content?.classList.contains('content')) return false;

                for (const el of [content, entry, utterance, messageStack]) {
                  el.style.setProperty('width', '100%', 'important');
                  el.style.setProperty('box-sizing', 'border-box', 'important');
                }

                card.style.setProperty('align-self', 'center', 'important');
                card.style.setProperty('max-width', '100%', 'important');
                card.style.setProperty('margin-top', '-35px', 'important');
                card.style.setProperty('margin-bottom', '0', 'important');

                node.style.setProperty('max-width', '100%', 'important');
                node.style.setProperty('height', 'auto', 'important');
                node.style.setProperty('display', 'block', 'important');

                // Usuwamy odstęp między grafiką a pierwszą chmurką
                const welcomeTextEntry = entry.nextElementSibling;

                if (welcomeTextEntry) {
                  welcomeTextEntry.style.setProperty(
                    'margin-top',
                    '0px',
                    'important'
                  );
                }

                // Znajdujemy przewijany obszar wiadomości
                let messageList = node;

                while (messageList && messageList.id !== 'message-list') {
                  messageList = messageList.parentElement ||
                                messageList.getRootNode().host ||
                                null;
                }

                if (messageList) {
                  const fitWelcomeImage = () => {
                    if (!messageList.clientHeight) return;

                    const listStyle = getComputedStyle(messageList);

                    // Pozostałe elementy powitania: tekst i przycisk
                    const otherMessages = Array.from(content.children).filter(
                      element => element !== entry
                    );

                    const parseSize = value => parseFloat(value) || 0;

                    // Wysokość pozostałych wiadomości wraz z marginesami
                    const reservedHeight = otherMessages.reduce((sum, element) => {
                      const style = getComputedStyle(element);

                      return sum + element.offsetHeight +
                        parseSize(style.marginTop) +
                        parseSize(style.marginBottom);
                    }, 0);

                    // Uwzględniamy marginesy wewnętrzne obszaru rozmowy
                    const listPadding = parseSize(listStyle.paddingTop) +
                                        parseSize(listStyle.paddingBottom);

                    // Dodatkowa wysokość kontenera obrazka
                    const imageWrapperHeight = entry.offsetHeight - node.offsetHeight;

                    // Maksymalna wysokość dostępna dla botki
                    const maxHeight = Math.max(
                      70,
                      Math.floor(
                        messageList.clientHeight -
                        listPadding -
                        reservedHeight -
                        imageWrapperHeight -
                        10
                      )
                    );

                    node.style.setProperty(
                      'max-height',
                      `${maxHeight}px`,
                      'important'
                    );
                  };

                  // Automatyczne dopasowanie do rozmiaru okna czatu
                  const resizeObserver = new ResizeObserver(fitWelcomeImage);
                  resizeObserver.observe(messageList);

                  // Ponowne obliczenie przy zmianie rozmiaru przeglądarki
                  window.addEventListener('resize', fitWelcomeImage);

                  // Pierwsze dopasowanie po załadowaniu grafiki
                  if (node.complete) {
                    requestAnimationFrame(fitWelcomeImage);
                  } else {
                    node.addEventListener('load', fitWelcomeImage, { once: true });
                  }

                  // Zatrzymanie dopasowywania po rozpoczęciu rozmowy
                  window.addEventListener('df-button-clicked', event => {
                    if (event.detail?.text === 'Rozumiem, zaczynajmy!') {
                      resizeObserver.disconnect();
                      window.removeEventListener('resize', fitWelcomeImage);
                    }
                  });
                }

                return true;
              }

              for (const child of node.children || []) {
                stack.push(child);
              }
            }

            return false;
          };

          let imageCenterAttempts = 0;

          const imageCenterPoll = setInterval(() => {
            imageCenterAttempts++;

            if (centerWelcomeImage(df) || imageCenterAttempts >= 40) {
              clearInterval(imageCenterPoll);
            }
          }, 150);

          // Stylowanie wyłącznie przycisku powitalnego
          const styleWelcomeButton = (root) => {
            const stack = [root];

            while (stack.length) {
              const node = stack.pop();

              if (node.shadowRoot) {
                stack.push(node.shadowRoot);
              }

              if (
                node.matches?.('button, [role="button"], a, .button') &&
                node.textContent?.includes('Rozumiem, zaczynajmy!')
              ) {
                node.setAttribute('data-ebok-welcome-button', '');

                // Wyśrodkowanie przycisku w obszarze rozmowy
                let card = node;

                while (card && card.tagName !== 'DF-CARD') {
                  card = card.parentElement || card.getRootNode().host || null;
                }

                if (card) {
                  const messageStack = card.parentElement;
                  const utterance = messageStack.getRootNode().host;
                  const entry = utterance.parentElement;
                  const content = entry.parentElement;

                  if (content?.classList.contains('content')) {
                    for (const el of [content, entry, utterance, messageStack]) {
                      el.style.setProperty('width', '100%', 'important');
                      el.style.setProperty('box-sizing', 'border-box', 'important');
                    }

                    card.style.setProperty('align-self', 'center', 'important');
                  }
                }

                // Identyfikacja ikony Material Icons
                const iconNode = Array.from(node.querySelectorAll('*')).find(
                  el => el.children.length === 0 &&
                        el.textContent?.trim() === 'rocket_launch'
                );

                if (iconNode) {
                  iconNode.setAttribute('data-ebok-welcome-icon', '');
                }

                const styleRoot = node.getRootNode();
                const customStyle = document.createElement('style');

                customStyle.textContent = `
                  [data-ebok-welcome-button] {
                    background-color: #d81e04 !important;
                    color: #ffffff !important;
                    border: 2px solid #d81e04 !important;
                    box-sizing: border-box !important;
                    box-shadow: none !important;
                    opacity: 1 !important;
                    filter: none !important;
                    transition: background-color 300ms ease,
                                color 300ms ease !important;
                  }

                  [data-ebok-welcome-button]:hover {
                    background-color: #ffffff !important;
                    color: #000000 !important;
                    opacity: 1 !important;
                    filter: none !important;
                  }

                  [data-ebok-welcome-button]::before,
                  [data-ebok-welcome-button]::after {
                    content: none !important;
                  }

                  /* Tekst biały w stanie normalnym */
                  [data-ebok-welcome-button] *,
                  [data-ebok-welcome-button] *::before,
                  [data-ebok-welcome-button] *::after {
                    color: #ffffff !important;
                    opacity: 1 !important;
                    filter: none !important;
                    transition: color 300ms ease,
                                fill 300ms ease !important;
                  }

                  /* Tekst czarny podczas hovera */
                  [data-ebok-welcome-button]:hover *,
                  [data-ebok-welcome-button]:hover *::before,
                  [data-ebok-welcome-button]:hover *::after {
                    color: #000000 !important;
                    opacity: 1 !important;
                    filter: none !important;
                  }

                  /* Rakieta jako SVG */
                  [data-ebok-welcome-button] svg,
                  [data-ebok-welcome-button] svg * {
                    fill: #ffffff !important;
                    color: #ffffff !important;
                  }

                  [data-ebok-welcome-button]:hover svg,
                  [data-ebok-welcome-button]:hover svg * {
                    fill: #d81e04 !important;
                    color: #d81e04 !important;
                  }

                  /* Rakieta jako Material Icons */
                  [data-ebok-welcome-button]:hover [data-ebok-welcome-icon],
                  [data-ebok-welcome-button]:hover .material-icons,
                  [data-ebok-welcome-button]:hover .material-symbols-outlined {
                    color: #d81e04 !important;
                  }
                `;

                styleRoot.appendChild(customStyle);

                return true;
              }

              for (const child of node.childNodes || []) {
                stack.push(child);
              }
            }

            return false;
          };
          let styleAttempts = 0;
          const buttonStylePoll = setInterval(() => {
            styleAttempts++;

            if (styleWelcomeButton(df) || styleAttempts >= 40) {
              clearInterval(buttonStylePoll);
            }
          }, 150);


          // Wyśrodkowanie grafiki i przycisku względem chmurki powitalnej
          let welcomeAlignmentAttempts = 0;

          const welcomeAlignmentPoll = setInterval(() => {
            welcomeAlignmentAttempts++;

            const stack = [df];

            let welcomeImage = null;
            let welcomeButton = null;
            let welcomeBubble = null;

            while (stack.length) {
              const node = stack.pop();
              if (!node) continue;

              if (
                node.tagName === 'IMG' &&
                node.getAttribute('src')?.includes('obrazek-widget.png')
              ) {
                welcomeImage = node;
              }

              if (node.matches?.('[data-ebok-welcome-button]')) {
                welcomeButton = node;
              }

              if (
                node.matches?.('.bot-message') &&
                node.textContent?.includes(
                  'Dzień dobry! Jestem Wirtualną Asystentką eBOK.'
                )
              ) {
                welcomeBubble = node;
              }

              if (node.shadowRoot) {
                stack.push(...node.shadowRoot.children);
              }

              stack.push(...node.children);
            }

            if (!welcomeImage || !welcomeButton || !welcomeBubble) {
              if (welcomeAlignmentAttempts >= 40) {
                clearInterval(welcomeAlignmentPoll);
              }
              return;
            }

            const findCard = (element) => {
              let current = element;

              while (current && current.tagName !== 'DF-CARD') {
                current = current.parentElement ||
                          current.getRootNode().host ||
                          null;
              }

              return current;
            };

            const imageCard = findCard(welcomeImage);
            const buttonCard = findCard(welcomeButton);

            if (!imageCard || !buttonCard) return;

            clearInterval(welcomeAlignmentPoll);

            const alignWelcome = () => {
              const bubbleRect = welcomeBubble.getBoundingClientRect();
              const targetCenter = bubbleRect.left + bubbleRect.width / 2;

              for (const card of [imageCard, buttonCard]) {
                card.style.removeProperty('translate');

                const rect = card.getBoundingClientRect();
                const currentCenter = rect.left + rect.width / 2;
                const offset = targetCenter - currentCenter;

                card.style.setProperty(
                  'translate',
                  `${offset}px 0`,
                  'important'
                );
              }
            };

            // Pierwsze wyrównanie
            alignWelcome();

            // Aktualizacja po zmianie rozmiaru przeglądarki
            window.addEventListener('resize', () => {
              requestAnimationFrame(alignWelcome);
            });

            // Aktualizacja, gdy zmieniają się rozmiary elementów
            const alignmentObserver = new ResizeObserver(() => {
              requestAnimationFrame(alignWelcome);
            });

            alignmentObserver.observe(welcomeBubble);
            alignmentObserver.observe(imageCard);
            alignmentObserver.observe(buttonCard);

          }, 150);


          let welcomeAccepted = false;

          const updateInput = () => {
            const chat = chatElement;
            const userInput = chat?.shadowRoot?.querySelector('df-messenger-user-input');

            if (!userInput) return false;

            // Input pozostaje widoczny, ale jest nieaktywny do akceptacji
            userInput.style.display = '';
            userInput.style.pointerEvents = welcomeAccepted ? '' : 'none';
            userInput.style.opacity = welcomeAccepted ? '1' : '0.65';

            // Delikatne ukośne kreskowanie nieaktywnego inputu
            userInput.style.setProperty(
              '--df-messenger-input-background',
              welcomeAccepted
                ? '#ffffff'
                : 'repeating-linear-gradient(135deg, #f4f4f4 0px, #f4f4f4 3px, #dedede 3px, #dedede 4px)'
            );

            trySetPlaceholder(chatElement);

            // Placeholder zależny od etapu rozmowy
            const inputBox = userInput.shadowRoot?.querySelector(
              '.input-box-wrapper .input-content-wrapper .input-box'
            );

            if (inputBox) {
              inputBox.setAttribute(
                'placeholder',
                welcomeAccepted
                  ? 'Tutaj wpisz swoje pytanie'
                  : 'Aby zacząć, wybierz powyższy guzik.'
              );
            }

            return true;
          };

          const waitForInput = () => {
            let attempts = 0;
            const pollId = setInterval(() => {
              attempts++;
              if (updateInput() || attempts >= 40) {
                clearInterval(pollId);
              }
            }, 150);
          };

          waitForInput();

          chatElement.addEventListener('click', waitForInput);

          window.addEventListener('df-button-clicked', (event) => {
            if (event.detail?.text !== 'Rozumiem, zaczynajmy!') return;

            welcomeAccepted = true;
            updateInput();
          });
        }
      }, 100);
    });
  </script>
</body>
</html>
