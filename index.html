<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dokument bez tytułu</title>

  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    df-messenger {
      z-index: 999;
      position: absolute;
      --df-messenger-titlebar-title-font-size: 16px;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-chat-window-height: 800px;
      --df-messenger-chat-window-width: 400px;
      --df-messenger-chat-bubble-border: 100px;
      --df-messenger-message-user-background: #ff6309;
      --df-messenger-message-user-font-color: #FFFFFF;
      --df-messenger-message-bot-background: #1B4280;
      --df-messenger-message-bot-font-color: #FFFFFF;
      --df-messenger-message-bot-writing-font-color: #FFFFFF;
      --df-messenger-message-bot-writing-background: #1B4280;
      --df-messenger-send-icon-color: #ff6309;

      bottom: 16px;
      right: 16px;
    }
  </style>
</head>

<body>

  <df-messenger
    project-id="wirtualna-asystentka-cx"
    agent-id="971672d5-f388-4c83-bc51-97e8945c8ad6"
    language-code="pl"
    max-query-length="-1">
    <df-messenger-chat-bubble chat-title="Wirtualna Asystentka PGNiG">
    </df-messenger-chat-bubble>
  </df-messenger>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const welcomeKey = 'df-welcome-message-shown';
    const chipsKey   = 'df-chips-shown';
    const dfMessenger = document.querySelector('df-messenger');

    // 1) Powitanie raz na sesję
    dfMessenger.addEventListener('df-messenger-loaded', () => {
      if (!sessionStorage.getItem(welcomeKey)) {
        dfMessenger.renderCustomText('Cześć! W czym mogę pomóc?', true);
        sessionStorage.setItem(welcomeKey, 'true');
      }
    });

    // 2) Przyciski po pierwszym otwarciu czatu
    window.addEventListener('df-chat-open-changed', (e) => {
      if (!e.detail.isOpen || sessionStorage.getItem(chipsKey)) return;

      const appendChipsTo = (wrapper) => {
        const chipContainer = document.createElement('div');
        chipContainer.style.cssText = `
          margin: 12px 16px;
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        `;

        const btnStyles = `
          background-color: #e1e8f6;
          color: #1B4280;
          border: none;
          padding: 8px 12px;
          border-radius: 16px;
          font-family: Google Sans, sans-serif;
          cursor: pointer;
          font-size: 14px;
        `;

        const makeBtn = (label, query) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.style.cssText = btnStyles;
          b.onclick = () => {
            dfMessenger.sendQuery(query);
            chipContainer.remove();
          };
          return b;
        };

        chipContainer.append(
          makeBtn('FAQ', 'FAQ'),
          makeBtn('Regulamin usługi / Polityka prywatności', 'Regulamin')
        );

        wrapper.appendChild(chipContainer);
        sessionStorage.setItem(chipsKey, 'true');
      };

      // Czekamy na .chat-wrapper wewnątrz shadow DOM
      const chat = dfMessenger.shadowRoot.querySelector('df-messenger-chat');
      const wrapper = chat?.shadowRoot.querySelector('.chat-wrapper');
      if (wrapper) {
        appendChipsTo(wrapper);
      } else {
        // jeśli jeszcze nie ma, pollujemy z requestAnimationFrame
        const waitWrap = () => {
          const c = dfMessenger.shadowRoot.querySelector('df-messenger-chat');
          const w = c?.shadowRoot.querySelector('.chat-wrapper');
          if (w) {
            appendChipsTo(w);
          } else {
            requestAnimationFrame(waitWrap);
          }
        };
        waitWrap();
      }
    });
  });
</script>


</body>
</html>
